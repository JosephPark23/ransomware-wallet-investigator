<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chainmark — Bitcoin address risk analysis</title>
    <meta
      name="description"
      content="Screen a Bitcoin address for ransomware and sanctions exposure, with every finding traced back to a named source."
    />
    <meta name="color-scheme" content="light dark" />

    <!--
      Theme is applied before first paint so a dark-mode user never sees a white
      flash. Inline and synchronous on purpose: a deferred script would run after
      the first frame, which is exactly the frame that matters.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('chainmark-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = stored || system;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <!--
      Three faces, three jobs: Instrument Sans for interface, IBM Plex Mono for
      anything the chain produced (addresses, hashes, figures), Newsreader for
      the single authored verdict sentence. Each has a full system fallback
      stack, so a blocked font CDN degrades the typography rather than the demo.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
